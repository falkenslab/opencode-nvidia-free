services:
  proxy:
    image: python:3.12-slim
    command: python -u /app/proxy/proxy.py
    volumes:
      - ./src:/app:ro
      - ./results:/results
    environment:
      UPSTREAM: https://integrate.api.nvidia.com
      STRIP_PARAMS: ${STRIP_PARAMS:-}
      PROXY_TAG: ${PROXY_TAG:-}
      PROXY_LOG: /results/${RUN_DATE:?define RUN_DATE}-proxy.jsonl

  runner:
    build:
      context: ./src/runner
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.32}
    image: opencode-nvidia-free:${OPENCODE_VERSION:-1.18.32}
    depends_on:
      - proxy
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?define NVIDIA_API_KEY}
      NVIDIA_BASE_URL: http://proxy:8080/v1
      RUN_DATE: ${RUN_DATE}
      TIMEOUT_S: ${TIMEOUT_S:-900}
    volumes:
      - ./task:/task:ro
      - ./results:/results
